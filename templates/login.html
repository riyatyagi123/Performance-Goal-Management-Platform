<!DOCTYPE html>
<html>
<head>
    <title>PMS Login</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Custom Modern UI -->
    <link href="{{ url_for('static', filename='custom.css') }}" rel="stylesheet">

    <style>
        .login-wrapper {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 35px 30px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
            animation: slideUpFade 0.7s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .logo {
            width: 70px;
            display: block;
            margin: 0 auto 20px;
            border-radius: 12px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
        }
    </style>
</head>

<body>

<div class="login-wrapper">
    <div class="login-card">

        <!-- LOGO -->
        <img src="{{ url_for('static', filename='img1.jpg') }}" class="logo">

        <h4 class="text-center mb-4 fw-bold" style="color: #0f172a; letter-spacing: -0.5px;">PMS</h4>

        <form method="POST" action="/login">

            <div class="mb-3">
                <label class="form-label"><i class="fa-solid fa-envelope text-primary me-1"></i> Email</label>
                <input type="text" name="email" class="form-control" placeholder="Enter email" required>
            </div>

            <div class="mb-4">
                <label class="form-label"><i class="fa-solid fa-lock text-primary me-1"></i> Password</label>
                <input type="password" name="password" class="form-control" placeholder="Enter password" required>
            </div>

            <button class="btn btn-primary w-100 fw-bold" style="padding: 12px; font-size: 16px;">
                Secure Login <i class="fa-solid fa-arrow-right ms-2"></i>
            </button>

        </form>

    </div>
</div>
</html>
